# 새 기능(모델)은 template/ 폴더를 sources/<기능 이름>/으로 복사해서 시작합니다. 기능 폴더 하나에 모델 하나이고, 이 파일은 models/model.yaml이 됩니다.
# 폴더에는 파이프라인 YAML(pipelines/: 단계와 실행 주기), 파이프라인이 부르는 함수의 빈 틀(training/, serving/, monitoring/),
# 저장 정의(storage/: 예측 기록 표 schema.sql, 피처 묶음 feature_store.py) 틀이 들어 있습니다.
# 각 함수 주석의 약속을 지켜 NotImplementedError 자리를 채우고, your_function과 <모델 이름>은 기능 폴더 이름으로 바꿉니다.
# 기능 폴더 이름이 곧 모델 이름이고, MLflow 실험·등록 모델 이름, DB 스키마 이름, Airflow DAG 이름 앞부분, 서빙 주소(/models/<이름>/predict)로 함께 쓰입니다.
# 영문 소문자로 시작하고 소문자, 숫자, 밑줄만 씁니다. common, public, 데이터 소스 이름(kpg193 등)은 쓸 수 없습니다. 예: voltage_estimation
owner: your_github_account
description: 이 모델이 무엇을 예측하는지 한 줄로
data_source: kpg193                    # 데이터 소스 이름 (data/<소스>/). 학습·서빙·분포 점검이 이 소스의 데이터를 씀

training:
  image: aiems-graphkit                # 학습 이미지 이름 (AIEMS_SIF_DIR/<image>.sif). 공용 이미지를 쓰고, 다른 라이브러리가 필요할 때만 모델 전용 이미지를 만듦
  config: sources/<기능 이름>/models/configs/train.yaml
  data_dir: data/kpg193/files/<모델 이름>  # 학습 데이터를 내보내는 폴더. data/<데이터 소스>/files/ 아래 이 모델 폴더 (git 제외)
  cooldown_days: 7                     # 마지막 학습 뒤 이 기간 안에는 자동 재학습을 요청하지 않음

evaluation:
  metric: test/your_metric             # 평가 run에 기록되는 MLflow 지표 이름. champion 교체 판단에 사용
  lower_is_better: true                # 지표가 작을수록 좋으면 true (오차), 클수록 좋으면 false (정확도)

monitoring:
  metric_column: your_metric           # <모델 이름>.prediction_metrics의 열. 예측마다 1건씩 기록
  aggregation: pooled_rmse             # 최근 기록을 합치는 방법: pooled_rmse 또는 mean
  window: 96                           # 최근 몇 건으로 성능을 볼지
  tolerance: 0.2                       # 오프라인 평가값보다 이 비율 넘게 나빠지면 재학습 요청

drift:
  window: 96                           # 최근 몇 건의 입력을 학습 데이터와 비교할지
  psi_threshold: 0.25                  # PSI가 이 값 이상이면 '분포 변화(shifted)'
  out_of_range_threshold: 0.01         # 학습 범위 밖 값의 비율이 이보다 크면 '범위 밖(out_of_range)'
  retrain_on: [out_of_range]           # 재학습을 요청할 판정: out_of_range, shifted
