# 데이터 소스 kpg193. 이 폴더에는 이 데이터에 관한 것을 모두 둠: 이 파일, schema.sql(DB 스키마), configs/(datakit 설정), feature_store.py(Feast 피처 뷰), handler/(처리 코드), files/(실제 데이터 파일)
# 등록 코드(ingest.py)와 datakit 실행 코드(datakit.py)는 handler/에 있음
# 소스 이름(폴더 이름)은 DB 스키마, Feast 이름 앞부분(kpg193_bus 등), 등록 DAG(kpg193_register), model.yaml의 data_source로 함께 쓰임
name: kpg193
owner: comom87
description: KPG193 계통(모선 193개)의 최적 조류(OPF) 시나리오. datakit으로 미리 만든 원본 9,994개를 실시간 데이터처럼 하나씩 등록
schedule: "*/15 * * * *"                # 등록 DAG 주기. 한 번에 시나리오 1개
retries: 3                               # 등록 DAG의 작업이 실패했을 때 다시 시도하는 횟수 (1분 간격)
