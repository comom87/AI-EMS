version: 1
task:
  task_name: OptimalPowerFlow
data:
  networks: ["KPG193_ver2_0"]
  scenarios: [9876]
  normalization: "HeteroDataMVANormalizer"
  baseMVA: 100
  mask_value: 0.0
  val_ratio: 0.1
  test_ratio: 0.1
  workers: 8
  split_by_load_scenario_idx: true
model:
  attention_head: 8
  edge_dim: 10
  hidden_size: 48
  input_bus_dim: 15
  input_gen_dim: 6
  output_bus_dim: 2
  output_gen_dim: 1
  num_layers: 12
  type: GNS_heterogeneous
optimizer:
  type: AdamW
  learning_rate: 0.0005
  optimizer_params:
    betas: [0.9, 0.999]
  scheduler_type: ReduceLROnPlateau
  scheduler_params:
    mode: min
    factor: 0.7
    patience: 5
seed: 42
verbose: true
training:
  batch_size: 64
  epochs: 50
  loss_weights: [0.1, 0.1, 0.75, 0.001]
  losses: ["LayeredWeightedPhysics", "MaskedGenMSE", "MaskedBusMSE", "QgViolationPenalty"]
  loss_args:
    - base_weight: 0.5
    - {}
    - {}
    - {}
  accelerator: gpu
  devices: auto
  strategy: auto
callbacks:
  patience: 100
  tol: 0
