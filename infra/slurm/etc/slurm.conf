ClusterName=celcitia
SlurmctldHost=celcitia

SlurmUser=slurm
SlurmdUser=root
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

AuthType=auth/munge
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
TaskProlog=/etc/slurm/task_prolog.sh

SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

GresTypes=gpu,mps
AccountingStorageTRES=gres/gpu,gres/mps

PriorityType=priority/multifactor
PriorityWeightFairshare=10000
PriorityWeightQOS=3000
PriorityWeightAge=1000
PriorityDecayHalfLife=7-0

PreemptType=preempt/none

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=localhost
AccountingStoragePort=6819
AccountingStorageEnforce=associations,limits,qos
JobAcctGatherType=jobacct_gather/cgroup
JobAcctGatherFrequency=30

SlurmctldTimeout=120
SlurmdTimeout=300
InactiveLimit=0
MinJobAge=300
KillWait=30
Waittime=0
ReturnToService=2

NodeName=celcitia CPUs=16 Boards=1 SocketsPerBoard=2 CoresPerSocket=4 ThreadsPerCore=2 RealMemory=370000 Gres=gpu:a5000:2,mps:200 State=UNKNOWN

PartitionName=gpu Nodes=celcitia Default=YES MaxTime=2-00:00:00 DefaultTime=04:00:00 State=UP AllowQos=small,urgent,default,large OverSubscribe=NO
PartitionName=cpu Nodes=celcitia MaxTime=2-00:00:00 DefaultTime=04:00:00 State=UP MaxCPUsPerNode=8
