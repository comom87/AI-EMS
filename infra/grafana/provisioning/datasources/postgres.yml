# Grafana 데이터 소스. 모두 ai-ems DB 서버(compose의 postgres)에 있음. 비밀번호는 compose가 넘겨준 환경 변수에서 읽음
apiVersion: 1
datasources:
  - name: aiems
    uid: aiems-postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: $AIEMS_DB_USER
    isDefault: true
    jsonData:
      database: $AIEMS_DB_NAME
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $AIEMS_DB_PASSWORD
  - name: mlflow
    uid: mlflow-postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: $AIEMS_DB_USER
    jsonData:
      database: mlflow
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $AIEMS_DB_PASSWORD
  - name: airflow
    uid: airflow-postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: $AIEMS_DB_USER
    jsonData:
      database: airflow
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $AIEMS_DB_PASSWORD
